<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>NBA Player Compare</title>
  <style>
    body { font-family: sans-serif; max-width: 800px; margin: 40px auto; padding: 0 20px; }
    .inputs { display: flex; gap: 10px; margin-bottom: 20px; }
    input { flex: 1; padding: 8px; font-size: 16px; }
    button { padding: 8px 16px; font-size: 16px; cursor: pointer; }
    table { width: 100%; border-collapse: collapse; margin-top: 20px; }
    th, td { border: 1px solid #ccc; padding: 8px; text-align: center; }
    th { background: #f0f0f0; }
    .error { color: red; }
  </style>
</head>
<body>
  <h1>NBA Player Compare</h1>
  <div class="inputs">
    <input id="player1" placeholder="Player 1 (e.g. LeBron James)">
    <input id="player2" placeholder="Player 2 (e.g. Stephen Curry)">
    <button onclick="compare()">Compare</button>
  </div>
  <div id="result"></div>

  <script>
    const API_BASE = "http://127.0.0.1:8000";

    async function fetchPlayer(name) {
      const res = await fetch(`${API_BASE}/player/${encodeURIComponent(name)}`);
      if (!res.ok) {
        const err = await res.json();
        throw new Error(err.detail || "Request failed");
      }
      return res.json();
    }

    async function compare() {
      const name1 = document.getElementById("player1").value.trim();
      const name2 = document.getElementById("player2").value.trim();
      const resultDiv = document.getElementById("result");
      resultDiv.innerHTML = "Loading...";

      try {
        const [data1, data2] = await Promise.all([
          fetchPlayer(name1),
          fetchPlayer(name2)
        ]);
        renderComparison(data1, data2);
      } catch (e) {
        resultDiv.innerHTML = `<p class="error">${e.message}</p>`;
      }
    }

    function renderComparison(data1, data2) {
      const latest1 = data1.seasons[data1.seasons.length - 1];
      const latest2 = data2.seasons[data2.seasons.length - 1];

      document.getElementById("result").innerHTML = `
        <table>
          <tr><th></th><th>${data1.player}</th><th>${data2.player}</th></tr>
          <tr><td>Season</td><td>${latest1.SEASON_ID}</td><td>${latest2.SEASON_ID}</td></tr>
          <tr><td>Games Played</td><td>${latest1.GP}</td><td>${latest2.GP}</td></tr>
          <tr><td>Points</td><td>${latest1.PTS}</td><td>${latest2.PTS}</td></tr>
          <tr><td>Rebounds</td><td>${latest1.REB}</td><td>${latest2.REB}</td></tr>
          <tr><td>Assists</td><td>${latest1.AST}</td><td>${latest2.AST}</td></tr>
        </table>
      `;
    }
  </script>
</body>
</html>
