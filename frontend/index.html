<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>NBA Player Compare</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      max-width: 720px;
      margin: 60px auto;
      padding: 0 20px;
      color: #1a1a1a;
    }
    h1 {
      font-size: 28px;
      margin-bottom: 24px;
    }
    .inputs {
      display: flex;
      gap: 10px;
      margin-bottom: 24px;
    }
    input {
      flex: 1;
      padding: 10px 12px;
      font-size: 15px;
      border: 1px solid #ddd;
      border-radius: 6px;
    }
    input:focus {
      outline: none;
      border-color: #999;
    }
    button {
      padding: 10px 20px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      border-radius: 6px;
      background: #1a1a1a;
      color: white;
    }
    button:hover { background: #333; }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 15px;
    }
    th, td {
      padding: 12px 14px;
      text-align: center;
    }
    th {
      font-weight: 600;
      border-bottom: 2px solid #1a1a1a;
    }
    td:first-child, th:first-child {
      text-align: left;
      color: #666;
      font-weight: 500;
    }
    tr:not(:last-child) td {
      border-bottom: 1px solid #eee;
    }
    .better { color: #1a9e4f; font-weight: 600; }
    .worse { color: #d93838; font-weight: 600; }
    .meta { color: #888; font-size: 13px; margin-top: 6px; }
    .error { color: #d93838; margin-top: 16px; }
    .loading { color: #888; margin-top: 16px; }
  </style>
</head>
<body>
  <h1>NBA Player Compare</h1>
  <div class="inputs">
    <input id="player1" placeholder="Player 1 (e.g. LeBron James)">
    <input id="player2" placeholder="Player 2 (e.g. Stephen Curry)">
    <button onclick="compare()">Compare</button>
  </div>
  <div id="result"></div>

  <script>
    const API_BASE = "http://127.0.0.1:8000";

    async function fetchPlayer(name) {
      const res = await fetch(`${API_BASE}/player/${encodeURIComponent(name)}`);
      if (!res.ok) {
        const err = await res.json();
        throw new Error(err.detail || "Request failed");
      }
      return res.json();
    }

    async function compare() {
      const name1 = document.getElementById("player1").value.trim();
      const name2 = document.getElementById("player2").value.trim();
      const resultDiv = document.getElementById("result");

      if (!name1 || !name2) {
        resultDiv.innerHTML = `<p class="error">Enter both player names.</p>`;
        return;
      }

      resultDiv.innerHTML = `<p class="loading">Loading...</p>`;

      try {
        const [a, b] = await Promise.all([fetchPlayer(name1), fetchPlayer(name2)]);
        renderComparison(a, b);
      } catch (e) {
        resultDiv.innerHTML = `<p class="error">${e.message}</p>`;
      }
    }

    // Returns {aClass, bClass} — "better"/"worse"/"" based on which value is higher
    function compareCells(aVal, bVal) {
      if (aVal === bVal) return { aClass: "", bClass: "" };
      return aVal > bVal
        ? { aClass: "better", bClass: "worse" }
        : { aClass: "worse", bClass: "better" };
    }

    function statRow(label, aVal, bVal, suffix = "") {
      const { aClass, bClass } = compareCells(aVal, bVal);
      return `
        <tr>
          <td>${label}</td>
          <td class="${aClass}">${aVal}${suffix}</td>
          <td class="${bClass}">${bVal}${suffix}</td>
        </tr>`;
    }

    function renderComparison(a, b) {
      document.getElementById("result").innerHTML = `
        <table>
          <tr><th></th><th>${a.player}</th><th>${b.player}</th></tr>
          ${statRow("Points / game", a.ppg, b.ppg)}
          ${statRow("Rebounds / game", a.rpg, b.rpg)}
          ${statRow("Assists / game", a.apg, b.apg)}
          ${statRow("Steals / game", a.spg, b.spg)}
          ${statRow("Blocks / game", a.bpg, b.bpg)}
          ${statRow("FG%", a.fg_pct, b.fg_pct, "%")}
          ${statRow("3PT%", a.fg3_pct, b.fg3_pct, "%")}
          ${statRow("FT%", a.ft_pct, b.ft_pct, "%")}
          ${statRow("True Shooting %", a.ts_pct, b.ts_pct, "%")}
        </table>
        <div class="meta">
          ${a.player}: ${a.season} season, ${a.team}, ${a.games_played} GP &nbsp;·&nbsp;
          ${b.player}: ${b.season} season, ${b.team}, ${b.games_played} GP
        </div>
      `;
    }
  </script>
</body>
</html>
